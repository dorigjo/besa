<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Besa">
  <title>Besa</title>
  <!-- Seal: hexagonal trust plate -->
  <path d="M11.75 4.5 H28.25 L36.5 20 L28.25 35.5 H11.75 L3.5 20 Z"
        fill="#A8D5B5" fill-opacity="0.12"
        stroke="#1B3A2D" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Gate: the threshold every call is checked against -->
  <path d="M24.5 11 V29"
        stroke="#1B3A2D" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Flow: the agent call arriving at the gate -->
  <path d="M12.5 13 L19 20 L12.5 27"
        fill="none" stroke="#2E6B4F" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
